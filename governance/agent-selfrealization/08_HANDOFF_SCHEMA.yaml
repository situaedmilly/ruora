# 08_HANDOFF_SCHEMA.yaml
#
# Suite status: CANDIDATE — not ratified, not wired into any runtime
# validator. See 00_MANIFEST.md. Machine-readable contract for the
# session-closing handoff produced at 06_RUNTIME_FLOW.md §17_HANDOFF.

"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "ourself.agent-runtime-handoff.v1"
title: "OURSELF SESSION HANDOFF"
schema_version: "ourself.agent-runtime-handoff.v1"
status: CANDIDATE_CONSTITUTIONAL_SCHEMA
type: object
additionalProperties: false
required:
  - handoff_version
  - timestamp
  - session_id
  - agent
  - execution_witness_ref
  - current_state
  - proven_state
  - unproven_state
  - outstanding_risk
  - next_lawful_gate
  - authority_required

"$defs":
  string_list:
    type: array
    items: { type: string }

properties:
  handoff_version:
    const: "ourself.agent-runtime-handoff.v1"

  timestamp:
    type: string
    format: date-time

  session_id:
    type: string
    minLength: 1

  agent:
    type: object
    additionalProperties: false
    required: [agent_name, assigned_role]
    properties:
      agent_name: { type: string }
      assigned_role: { type: string }

  execution_witness_ref:
    description: "Reference to the 07_EXECUTION_WITNESS_SCHEMA.yaml instance
      this handoff summarizes. A handoff with no witness behind it is
      narrative, not evidence."
    type: string

  current_state:
    type: string
    description: "What is true right now, independent of intent or plan."

  proven_state:
    description: "Claims backed by verification_results / evidence_refs in
      the referenced execution witness."
    "$ref": "#/$defs/string_list"

  unproven_state:
    description: "Claims that remain asserted but not independently
      verified — explicitly named rather than folded into proven_state."
    "$ref": "#/$defs/string_list"

  outstanding_risk:
    "$ref": "#/$defs/string_list"

  next_lawful_gate:
    type: string
    description: "Must correspond to an entry in the governing roadmap this
      session operates against, if one exists; otherwise UNKNOWN."

  authority_required:
    description: "What authority dimension(s) the next lawful gate would
      need that this session does not currently hold."
    "$ref": "#/$defs/string_list"

allOf:
  - if:
      properties:
        unproven_state:
          minItems: 1
    then:
      description: >
        Any handoff with non-empty unproven_state may not be cited
        elsewhere as fully proven — consuming documents must preserve the
        proven/unproven distinction rather than collapsing it.
      properties:
        current_state: { minLength: 1 }
