# 03_SELFREALIZATION_SCHEMA.yaml
#
# Suite status: CANDIDATE — not ratified as a complete suite and not
# runtime-enforced. See 00_MANIFEST.md.
#
# Ratified schema amendments (narrow; do not ratify the suite):
#   - F-01 / F-02 / F-04 role-correspondence repair — FOUNDER-DISPOSITION-001
#   - SR-EXEC-001 execute-ceiling amendment — FOUNDER-DISPOSITION-002
#
# This is a machine-readable CONTRACT for the selfrealization_record
# produced under 02_SELFREALIZATION_PROMPT.md. It is written as a JSON
# Schema (2020-12) expressed in YAML so it can be validated by any
# standard JSON Schema tool without a bespoke parser.
#
# Design rules this schema enforces:
#   - No field has an implicit default. Authority fields in particular
#     have no default: absence is a schema violation, not a silent grant
#     or a silent denial.
#   - "UNKNOWN" is a permitted, explicit string value for identity/
#     environment fields that could not be truthfully determined. It is
#     never permitted for authority fields — authority is strictly
#     GRANTED or DENIED, per the law "any authority not explicitly
#     granted is DENIED."
#   - additionalProperties: false everywhere, to keep the vocabulary
#     closed — an agent cannot invent a new field to smuggle in an
#     unreviewed claim.
#   - verdict.status = REALIZED requires blocking_conditions to be empty
#     AND requires all eleven authority dimensions to be present (not
#     necessarily all GRANTED — REALIZED certifies that authority was
#     explicitly considered, not that everything was granted). As of the
#     F-01/F-02/F-04 amendment, REALIZED is further role-conditioned: see
#     the allOf block below for per-role mutate/verify/seal ceilings. As
#     of the SR-EXEC-001 amendment, authority.execute is likewise
#     role-conditioned for every role except executor and recovery. The
#     two amendments are additive and independent — neither weakens the
#     other.

"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "ourself.agent-selfrealization.v1"
title: "OURSELF SELFREALIZATION RECORD"
schema_version: "ourself.agent-selfrealization.v1"
status: CANDIDATE_CONSTITUTIONAL_SCHEMA
type: object
additionalProperties: false
required:
  - protocol_version
  - identity
  - environment
  - constitution
  - authority
  - objective
  - memory
  - verdict

"$defs":
  unknown_or_string:
    description: >
      MUST be the literal string "UNKNOWN" when the true value cannot be
      witnessed. Guessing is prohibited. Field absence is a schema
      violation — it is not equivalent to UNKNOWN.
    type: string
    minLength: 1

  string_list:
    type: array
    items:
      type: string

  authority_grant:
    description: >
      Binary, explicit authority state. No default value. A document
      missing this field is INVALID — invalidity blocks REALIZED; it does
      not resolve to DENIED by omission.
    type: string
    enum: [GRANTED, DENIED]

  verdict_enum:
    type: string
    enum:
      - REALIZED
      - PARTIALLY_REALIZED
      - UNREALIZED
      - CONSTITUTIONAL_CONFLICT
      - ENVIRONMENT_CONFLICT
      - AUTHORITY_CONFLICT

  role_enum:
    description: >
      Closed set of ratified role identifiers. Closes Founder finding
      F-01: assigned_role was previously $ref unknown_or_string (an
      unconstrained non-empty string) with no structural link to
      04_ROLE_CONSTITUTIONS/*.md. Each non-UNKNOWN value corresponds 1:1
      to the literal identity.assigned_role value in that role file's own
      "Schema binding" line (verified against all 11 files' lines 4-5 and
      against 00_MANIFEST.md's file inventory, lines 42-52). UNKNOWN is
      preserved as the pre-existing sentinel (see unknown_or_string above
      and the allOf UNKNOWN clause below).
    type: string
    enum:
      - UNKNOWN
      - architect
      - dispatcher
      - executor
      - governor
      - memory-keeper
      - observer
      - orchestrator
      - planner
      - recovery
      - researcher
      - verifier

  ceiling_mutate_denied:
    description: >
      Forces authority.mutate to DENIED for a role whose ratified
      mutation ceiling is a clean STRUCTURALLY_DENIED, or a
      STRUCTURALLY_DENIED-by-default ceiling whose sole carve-out is a
      narrow, separately-granted exception this schema has no field to
      distinguish from an ordinary grant (see architect.md L35-37,
      verifier.md L40-42).
    properties:
      authority:
        properties:
          mutate: { const: DENIED }

  ceiling_verify_denied:
    description: >
      Forces authority.verify to DENIED for a role whose ratified
      verification ceiling is None / STRUCTURALLY_DENIED over the
      actions or output in question.
    properties:
      authority:
        properties:
          verify: { const: DENIED }

  ceiling_seal_denied:
    description: >
      Forces authority.seal to DENIED for a role whose ratified seal
      ceiling is a clean STRUCTURALLY_DENIED (all roles except Governor
      and Verifier, which independently carry a PERMITTED_IF_GRANTED,
      recommend-only exception).
    properties:
      authority:
        properties:
          seal: { const: DENIED }

  ceiling_execute_denied:
    description: >
      Forces authority.execute to DENIED for a role whose ratified
      constitution supports that reading, at one of three different
      textual strengths — disclosed here rather than flattened into one
      category, per the independent cold review of this amendment:
      (1) directly stated, using the literal verb "execute" or its
      synonym "implement" (governor: "Cannot execute whatever it
      admits"; planner: "Cannot execute its own plan"; architect: "Cannot
      implement its own design"); (2) strong structural inference from
      repeated no-mutation/no-aggregation framing, without either verb
      ever appearing (orchestrator: "No inherited mutation authority,
      ever"; observer: "Cannot mutate anything, under any circumstance";
      researcher: purely evidentiary role, "Cannot mutate"); (3) genuine
      textual silence, resolved conservatively rather than left
      unconstrained (dispatcher, memory-keeper — neither role's
      constitution addresses execution either way). Also applied to
      verifier, a distinct fourth case: its constitution neither clearly
      grants nor clearly denies execution (its verification duties —
      regression results, cold-process verification — plausibly require
      running checks), but absent a schema field to express that narrow,
      verification-scoped exception distinctly from an ordinary grant,
      this schema resolves the ambiguity conservatively to DENIED,
      mirroring the identical precedent already set for architect's
      doc-only mutate carve-out above. Never applied to executor or
      recovery, whose constitutions
      each explicitly describe a real execution capability (executor:
      "may run tests as part of producing execution evidence"; recovery:
      "the restoration action") — those two roles are deliberately left
      schema-unconstrained on this dimension, exactly as before this
      amendment.
    properties:
      authority:
        properties:
          execute: { const: DENIED }

properties:
  protocol_version:
    const: "ourself.agent-selfrealization.v1"

  identity:
    type: object
    additionalProperties: false
    required:
      - agent_name
      - agent_class
      - model_runtime
      - session_id
      - parent_orchestrator
      - assigned_role
      - assigned_objective
      - entered_system
    properties:
      agent_name: { "$ref": "#/$defs/unknown_or_string" }
      agent_class: { "$ref": "#/$defs/unknown_or_string" }
      model_runtime: { "$ref": "#/$defs/unknown_or_string" }
      session_id: { "$ref": "#/$defs/unknown_or_string" }
      parent_orchestrator: { "$ref": "#/$defs/unknown_or_string" }
      assigned_role:
        description: >
          Must be one of the eleven literal role identifiers bound in
          04_ROLE_CONSTITUTIONS/*.md's own "Schema binding" lines, or
          UNKNOWN. Structurally enforced by $defs/role_enum (closes
          Founder finding F-01).
        "$ref": "#/$defs/role_enum"
      assigned_objective: { "$ref": "#/$defs/unknown_or_string" }
      entered_system: { "$ref": "#/$defs/unknown_or_string" }

  environment:
    type: object
    additionalProperties: false
    required:
      - workspace
      - repository
      - branch
      - head
      - working_tree
      - tools_available
      - writable_boundaries
      - read_only_boundaries
      - witnessed_at
    properties:
      workspace: { "$ref": "#/$defs/unknown_or_string" }
      repository: { "$ref": "#/$defs/unknown_or_string" }
      branch: { "$ref": "#/$defs/unknown_or_string" }
      head:
        description: "Source-revision field. Full commit hash, or UNKNOWN."
        "$ref": "#/$defs/unknown_or_string"
      working_tree: { "$ref": "#/$defs/unknown_or_string" }
      tools_available: { "$ref": "#/$defs/string_list" }
      writable_boundaries: { "$ref": "#/$defs/string_list" }
      read_only_boundaries: { "$ref": "#/$defs/string_list" }
      witnessed_at:
        description: "UTC timestamp of live witness, not of memory recall."
        type: string
        format: date-time

  constitution:
    type: object
    additionalProperties: false
    required:
      - durable_doctrine
      - project_instructions
      - task_authorization
      - prohibitions
      - evidence_standard
    properties:
      durable_doctrine: { "$ref": "#/$defs/string_list" }
      project_instructions: { "$ref": "#/$defs/string_list" }
      task_authorization: { "$ref": "#/$defs/string_list" }
      prohibitions: { "$ref": "#/$defs/string_list" }
      evidence_standard: { "$ref": "#/$defs/string_list" }

  authority:
    description: >
      Every dimension is independently required. There is no dimension
      whose absence is treated as an implicit grant.
    type: object
    additionalProperties: false
    required:
      - perceive
      - reason
      - plan
      - mutate
      - execute
      - verify
      - commit
      - merge
      - deploy
      - communicate
      - seal
    properties:
      perceive: { "$ref": "#/$defs/authority_grant" }
      reason: { "$ref": "#/$defs/authority_grant" }
      plan: { "$ref": "#/$defs/authority_grant" }
      mutate: { "$ref": "#/$defs/authority_grant" }
      execute: { "$ref": "#/$defs/authority_grant" }
      verify: { "$ref": "#/$defs/authority_grant" }
      commit: { "$ref": "#/$defs/authority_grant" }
      merge: { "$ref": "#/$defs/authority_grant" }
      deploy: { "$ref": "#/$defs/authority_grant" }
      communicate: { "$ref": "#/$defs/authority_grant" }
      seal: { "$ref": "#/$defs/authority_grant" }

  objective:
    type: object
    additionalProperties: false
    required:
      - statement
      - in_scope
      - out_of_scope
      - success_condition
      - failure_condition
      - stop_condition
      - required_evidence
    properties:
      statement: { type: string }
      in_scope: { "$ref": "#/$defs/string_list" }
      out_of_scope: { "$ref": "#/$defs/string_list" }
      success_condition: { "$ref": "#/$defs/string_list" }
      failure_condition: { "$ref": "#/$defs/string_list" }
      stop_condition: { "$ref": "#/$defs/string_list" }
      required_evidence: { "$ref": "#/$defs/string_list" }

  memory:
    type: object
    additionalProperties: false
    required:
      - authoritative_sources
      - stale_or_unverified_sources
      - contradictions
      - fresh_witness_required
    properties:
      authoritative_sources: { "$ref": "#/$defs/string_list" }
      stale_or_unverified_sources: { "$ref": "#/$defs/string_list" }
      contradictions: { "$ref": "#/$defs/string_list" }
      fresh_witness_required: { "$ref": "#/$defs/string_list" }

  verdict:
    type: object
    additionalProperties: false
    required:
      - status
      - blocking_conditions
      - next_required_authority
      - evaluated_at
    properties:
      status: { "$ref": "#/$defs/verdict_enum" }
      blocking_conditions:
        description: "Refusal reasons. Must be empty for status REALIZED."
        "$ref": "#/$defs/string_list"
      next_required_authority:
        description: >
          What authorization must be sought next (e.g. a specific
          05_RUNTIME_AUTHORIZATION_PACKET.md gate). Not itself a grant.
        type: string
      evaluated_at:
        type: string
        format: date-time

allOf:
  - if:
      properties:
        verdict:
          properties: { status: { const: REALIZED } }
    then:
      properties:
        verdict:
          properties:
            blocking_conditions: { maxItems: 0 }
        authority:
          required:
            [perceive, reason, plan, mutate, execute, verify, commit, merge,
             deploy, communicate, seal]

  # --- Role-ceiling conditioning added to close Founder findings F-02/F-04.
  # STRUCTURALLY_DENIED / PERMITTED_IF_GRANTED are cited only in $defs
  # description prose above and in comments here, as source-traceability
  # annotations — never as instance-data or enum/const values. The
  # authority vocabulary stays strictly GRANTED/DENIED throughout.

  # Group 1 — Architect, Observer, Orchestrator, Planner, Researcher:
  # clean STRUCTURALLY_DENIED on mutate, verify, and seal.
  - if:
      properties:
        identity:
          properties:
            assigned_role:
              enum: [architect, observer, orchestrator, planner, researcher]
    then:
      allOf:
        - { "$ref": "#/$defs/ceiling_mutate_denied" }
        - { "$ref": "#/$defs/ceiling_verify_denied" }
        - { "$ref": "#/$defs/ceiling_seal_denied" }

  # Group 2 — Governor: mutate/verify clean-denied. Seal left open
  # (governor.md L45-51, PERMITTED_IF_GRANTED capped recommend-only —
  # cap itself not representable by the binary enum; residual F-04 gap).
  - if:
      properties:
        identity:
          properties: { assigned_role: { const: governor } }
    then:
      allOf:
        - { "$ref": "#/$defs/ceiling_mutate_denied" }
        - { "$ref": "#/$defs/ceiling_verify_denied" }

  # Group 3 — Dispatcher, Executor, Memory-Keeper, Recovery: verify/seal
  # clean-denied. Mutate left open — each file grants a real, un-hedged
  # PERMITTED_IF_GRANTED mutation ceiling scoped via writable_boundaries.
  - if:
      properties:
        identity:
          properties:
            assigned_role:
              enum: [dispatcher, executor, memory-keeper, recovery]
    then:
      allOf:
        - { "$ref": "#/$defs/ceiling_verify_denied" }
        - { "$ref": "#/$defs/ceiling_seal_denied" }

  # Group 4 — Verifier: verify/seal left open (verifier.md L44-46 "Full ...
  # entire purpose"; seal L48-51 same recommend-only shape as Governor).
  # Mutate forced DENIED: L38-42's "never assumed" exception has no
  # companion field yet to carry it distinctly from an ordinary GRANTED.
  # Directly closes the Founder's named F-02 counterexample.
  - if:
      properties:
        identity:
          properties: { assigned_role: { const: verifier } }
    then:
      allOf:
        - { "$ref": "#/$defs/ceiling_mutate_denied" }

  # Group 5 — UNKNOWN: no ratified ceiling exists, so all three
  # dimensions default DENIED and REALIZED is foreclosed, consistent with
  # 09_FALSIFICATION_TESTS.md Test 4 (L72-84). Supplementary, additive.
  - if:
      properties:
        identity:
          properties: { assigned_role: { const: UNKNOWN } }
    then:
      allOf:
        - { "$ref": "#/$defs/ceiling_mutate_denied" }
        - { "$ref": "#/$defs/ceiling_verify_denied" }
        - { "$ref": "#/$defs/ceiling_seal_denied" }
        - { "$ref": "#/$defs/ceiling_execute_denied" }
      properties:
        verdict:
          properties:
            status: { not: { const: REALIZED } }

  # Group 6 — Execute ceiling (SR-EXEC-001). Applies to every named role
  # except Executor and Recovery, whose constitutions each describe a
  # real, bounded execution capability the schema must not foreclose.
  # UNKNOWN is handled above (Group 5), which now also forces
  # execute:DENIED via the same $defs/ceiling_execute_denied reference.
  # This group is purely additive to Groups 1-4: it does not alter,
  # replace, or interact with any existing mutate/verify/seal clause.
  - if:
      properties:
        identity:
          properties:
            assigned_role:
              enum:
                - architect
                - dispatcher
                - governor
                - memory-keeper
                - observer
                - orchestrator
                - planner
                - researcher
                - verifier
    then:
      allOf:
        - { "$ref": "#/$defs/ceiling_execute_denied" }

# Rollback: not applicable at this chamber. SELFREALIZATION performs no
# mutation and has nothing to roll back; rollback fields belong to
# 07_EXECUTION_WITNESS_SCHEMA.yaml, where mutation actually occurs.
